<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather</title>
        <link rel="stylesheet" href="./style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="main-body">
            <div class="info">
                <h4 class="city">Sialkot</h4>
                <h4 class="date">27.01.2024</h4>
            </div>
            <div class="temp-area">
                <h1 class="temp">20°</h1>
                <p class="wind"><i class="fa-solid fa-wind"></i> 6.1 mph</p>
                <p class="wind"><i class="fa-solid fa-droplet"></i> 90 %</p>
            </div>
        </div>
        <div class="sidebar"></div>
        <script src="https://kit.fontawesome.com/0d5b687ba9.js" crossorigin="anonymous"></script>
    </body>
</html>
